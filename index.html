<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PLN Teminabuan — GARDU TRACKER</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{
      --blue:#217346; --blue2:#107C41; --cyan:#70AD47; --bg:#F3F8F5;
      --card:rgba(255,255,255,.94); --text:#122033; --muted:#66758a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
    body{overflow:hidden}
    .app{height:100dvh;display:flex;flex-direction:column}
    .header{
      position:relative;z-index:1000;padding:12px 16px;
      background:linear-gradient(135deg,#107C41,#217346 55%,#70AD47);
      color:white;box-shadow:0 5px 22px rgba(33,115,70,.24)
    }
    .brand{display:flex;align-items:center}
    .logo{width:76px;height:44px;border-radius:10px;background:rgba(255,255,255,.08);
     display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.20);padding:2px}
    .logo img{width:100%;height:100%;object-fit:contain;display:block}
    .title{font-size:18px;font-weight:850;line-height:1.1}.subtitle{font-size:11px;opacity:.85;margin-top:3px}
    .search-wrap{margin-top:10px;display:flex;gap:8px}
    .search{flex:1;border:0;outline:0;border-radius:13px;padding:12px 14px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
    .btn{border:0;border-radius:13px;padding:0 15px;font-weight:800;background:white;color:#107C41;cursor:pointer}
    .main{position:relative;flex:1;min-height:0}
    #map{position:absolute;inset:0}
    .panel{
     position:absolute;z-index:900;left:14px;top:14px;width:min(360px,calc(100vw - 28px));
     background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);
     border-radius:18px;box-shadow:0 12px 35px rgba(24,53,80,.2);overflow:hidden
    }
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#dce7f1}
    .stat{padding:11px;background:rgba(255,255,255,.94);text-align:center}
    .stat b{display:block;font-size:19px;color:var(--blue2)} .stat span{font-size:10px;color:var(--muted)}
    .list{max-height:calc(100dvh - 250px);overflow:auto}
    .item{padding:11px 13px;border-bottom:1px solid #e7edf3;cursor:pointer;transition:.15s}
    .item:hover{background:#EAF4EE}.code{font-weight:850;color:#107C41;font-size:13px}.addr{font-size:11px;margin-top:3px;line-height:1.35}
    .meta{font-size:10px;color:var(--muted);margin-top:5px}
    .mobile-toggle{
     display:none;position:absolute;z-index:1001;right:14px;bottom:16px;border:0;border-radius:50%;
     width:52px;height:52px;background:#217346;color:#fff;font-size:22px;box-shadow:0 8px 22px rgba(33,115,70,.30)
    }
    .gardu-marker{position:relative;width:42px;height:42px}
    .gardu-icon{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));}
    .gardu-dot{display:none;width:16px;height:16px;border-radius:50%;background:#00c853;border:3px solid #fff;
     box-shadow:0 0 0 4px rgba(0,200,83,.30),0 3px 12px rgba(0,120,50,.40);position:absolute;left:3px;top:3px}
    .gardu-pulse{position:absolute;inset:-4px;border-radius:50%;border:2px solid #00e676;animation:pulse 1.8s ease-out infinite;opacity:.75}
    @keyframes pulse{0%{transform:scale(.45);opacity:.85}80%,100%{transform:scale(1.65);opacity:0}}
    .leaflet-popup-content{margin:13px 15px}.popup h3{margin:0 0 5px;color:#107C41;font-size:16px}
    .popup p{margin:5px 0;font-size:12px}.popup .coord{font-family:ui-monospace,monospace;font-size:10px;color:#536579}
    .navbtn{display:inline-block;margin-top:8px;padding:8px 10px;border-radius:9px;background:#217346;color:white!important;text-decoration:none;font-size:11px;font-weight:800}
    .notice{padding:10px 13px;font-size:11px;color:#526579;background:#F5FAF7;border-bottom:1px solid #e7edf3}
    .map-modes{
     position:absolute;z-index:950;right:14px;top:14px;display:flex;gap:6px;
     background:rgba(255,255,255,.96);padding:5px;border-radius:13px;
     box-shadow:0 8px 22px rgba(24,53,80,.22);backdrop-filter:blur(10px)
    }
    .map-mode{
     border:0;border-radius:9px;padding:8px 10px;background:transparent;color:#29435e;
     font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap
    }
    .map-mode:hover{background:#EAF4EE}
    .map-mode.active{background:#217346;color:#fff}
    .search-empty{padding:16px 13px;color:#66758a;font-size:11px;line-height:1.45}
    .search-result{border-left:4px solid #217346}

    @media(max-width:700px){
     .panel{left:10px;right:10px;width:auto;top:10px;display:none}
     .panel.open{display:block}
     .list{max-height:48dvh}
     .mobile-toggle{display:block}
    }

    .map-switch{position:absolute;z-index:950;top:14px;right:14px;display:flex;gap:5px;padding:5px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.8);border-radius:13px;box-shadow:0 8px 24px rgba(24,53,80,.22)}
    .map-switch button{border:0;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:850;color:#40546b;background:#EEF5F0;cursor:pointer;transition:.15s}.map-switch button:hover{background:#DDEEE3}.map-switch button.active{background:#217346;color:#fff;box-shadow:0 3px 9px rgba(33,115,70,.28)}
  </style>
</head>

<div class="app">
  <header class="header">
    <div class="brand">
      <div><div class="title">GARDU TRACKER</div><div class="subtitle">PLN Teminabuan • Titik Koordinat Gardu</div></div>
    </div>
    <div class="search-wrap">
      <input id="search" class="search" placeholder="Cari kode TMB, alamat, atau penyulang..." autocomplete="off">

    </div>

  <main class="main">

    <section id="panel" class="panel open">
      <div class="stats">

      </div>
      <div class="notice">Klik titik di peta untuk melihat detail gardu. Gunakan pencarian untuk menemukan TMB tertentu.</div>
      <div id="list" class="list"></div>
    </section>
    <button class="mobile-toggle" onclick="togglePanel()">☰</button>
  </main>
</div>

     iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-11]
   });

  function popup(r){
   const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}`;
   return `<div class="popup">
     <h3>${esc(r.code)}</h3>
     <p><b>${esc(r.address)}</b></p>
     <p>Wilayah: ${esc(r.area)} • Kapasitas: ${esc(r.capacity || '-')} kVA</p>
     <p>Penyulang: <b>${esc(r.penyulang || '-')}</b></p>
     <p>Beban: ${Number(r.beban || 0).toFixed(2)} A • Pembebanan: ${Number(r.pembebanan || 0).toFixed(2)}%</p>
     <p>Fasa: ${esc(r.fasa || '-')} • Tahun: ${r.year || '-'}</p>
     <div class="coord">${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</div>
     <a class="navbtn" href="${mapsUrl}" target="_blank" rel="noopener">Buka Navigasi Google Maps ↗</a>
   </div>`;
  }

  function addMarkers(){
   gardu.forEach((r,i)=>{
     const m=L.marker([r.lat,r.lng],{icon:icon(),title:r.code});
     m.bindPopup(popup(r),{maxWidth:300});
     m.addTo(map);
     markers.push({data:r,marker:m});
     markerByCode.set(r.code,m);
   });
  }

  function searchScore(r,q){
   const code=String(r.code||'').toLowerCase();
   const address=String(r.address||'').toLowerCase();
   const area=String(r.area||'').toLowerCase();
   const hay=[code,address,area].join(' ');
   if(code===q) return 1000;
   if(code.startsWith(q)) return 900;
   if(code.includes(q)) return 800;
   if(address.startsWith(q)) return 700;
   if(address.includes(q)) return 600;
   if(area===q) return 500;
   if(area.startsWith(q)) return 400;
   if(area.includes(q)) return 300;
   if(hay.includes(q)) return 100;
   return -1;
  }

  function getFilteredGardu(filter=''){
   const q=filter.trim().toLowerCase();
   if(!q) return gardu.slice();

   // Jika yang diketik cocok dengan wilayah/area, tampilkan SEMUA gardu
   // pada wilayah tersebut dan sembunyikan gardu wilayah lain.
   const areaMatches=gardu.filter(r=>String(r.area||'').toLowerCase().includes(q));
   if(areaMatches.length) return areaMatches;

   // Untuk pencarian kode/alamat, tampilkan semua gardu yang cocok juga.
   return gardu.filter(r=>{
     const code=String(r.code||'').toLowerCase();
     const address=String(r.address||'').toLowerCase();
     const penyulang=String(r.penyulang||'').toLowerCase();
     return code.includes(q) || address.includes(q) || penyulang.includes(q);
   });
  }

  function getBestResult(filter=''){
   const results=getFilteredGardu(filter);
   if(!results.length) return null;
   const q=filter.trim().toLowerCase();
   return results.slice().sort((a,b)=>{
     const score=r=>{
       const code=String(r.code||'').toLowerCase();
       const area=String(r.area||'').toLowerCase();
       const address=String(r.address||'').toLowerCase();
       if(area===q) return 1000;
       if(code===q) return 950;
       if(code.startsWith(q)) return 900;
       if(area.startsWith(q)) return 850;
       if(address.startsWith(q)) return 700;
       return 100;
     };
     return score(b)-score(a);
   })[0] || null;
  }

  function updateMarkerVisibility(filter=''){
   const results=getFilteredGardu(filter);
   const visibleCodes=new Set(results.map(r=>r.code));
   markers.forEach(x=>{
     if(visibleCodes.has(x.data.code)){
       if(!map.hasLayer(x.marker)) x.marker.addTo(map);
     }else{
       if(map.hasLayer(x.marker)) map.removeLayer(x.marker);
     }
   });
   return results;
  }

  function renderList(filter=''){
   const q=filter.trim();
   const list=document.getElementById('list');
   const results=updateMarkerVisibility(q);

   if(!q){
     list.innerHTML='';
     document.getElementById('total').textContent=gardu.length;
     return results;
   }

   if(!results.length){
     list.innerHTML='<div class="search-empty">Tidak ada gardu yang cocok.<br>Coba kode TMB, alamat, penyulang, atau wilayah lain.</div>';
     document.getElementById('total').textContent='0';
     return null;
   }

   list.innerHTML=results.map(r=>`<div class="item search-result" onclick="focusGardu('${escAttr(r.code)}')">
     <div class="code">${esc(r.code)}</div>
     <div class="addr">${esc(r.address)}</div>
     <div class="meta">${esc(r.area)} • ${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}</div>
   </div>`).join('');
   document.getElementById('total').textContent=results.length;
   return results;
  }

  function focusFilteredResults(results){
   if(!results || !results.length) return;
   if(results.length===1){
     focusGardu(results[0].code);
     return;
   }
   const bounds=L.latLngBounds(results.map(r=>[r.lat,r.lng]));
   if(bounds.isValid()) map.fitBounds(bounds,{padding:[60,60],maxZoom:16,animate:true});
  }

  function focusGardu(code){
   const m=markerByCode.get(code);
   if(!m)return;
   map.setView(m.getLatLng(),18,{animate:true,duration:.7});
   m.openPopup();
   if(innerWidth<=700) document.getElementById('panel').classList.remove('open');
  }


  function locateMe(){
   if(!navigator.geolocation){alert('GPS tidak tersedia di perangkat ini.');return;}
   navigator.geolocation.getCurrentPosition(p=>{
     const ll=[p.coords.latitude,p.coords.longitude];
     map.setView(ll,17,{animate:true});
     L.circleMarker(ll,{radius:8,weight:3}).addTo(map).bindPopup('Lokasi Anda').openPopup();
   },()=>alert('Izin lokasi belum diberikan atau lokasi tidak tersedia.'));
  }
  function togglePanel(){document.getElementById('panel').classList.toggle('open')}
  function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
  function escAttr(s){return esc(s).replace(/`/g,'&#096;')}

  let searchTimer=null;
  document.getElementById('search').addEventListener('input',e=>{
    clearTimeout(searchTimer);
    const value=e.target.value;
    const results=renderList(value);

    if(!value.trim()){
      if(gardu.length){
        const tmbBounds = L.latLngBounds(gardu.map(r=>[r.lat,r.lng]));
        map.fitBounds(tmbBounds,{padding:[35,35],maxZoom:11,animate:true});
      }
      return;
    }

    // Saat mengetik nama wilayah (mis. ELANG/YANI), semua gardu wilayah
    // tersebut tetap terlihat dan peta otomatis menyesuaikan seluruh titik.
    searchTimer=setTimeout(()=>{
      focusFilteredResults(results);
    },180);
  });

  document.getElementById('search').addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      clearTimeout(searchTimer);
      const results=renderList(e.target.value);
      focusFilteredResults(results);
    }
  });

  addMarkers();
  if(gardu.length){
    const tmbBounds = L.latLngBounds(gardu.map(r=>[r.lat,r.lng]));
    map.fitBounds(tmbBounds,{padding:[35,35],maxZoom:11});
  }
  renderList('');
  document.getElementById('pln').textContent=gardu.filter(r=>String(r.ulp||'').toUpperCase()==='ULP TEMINABUAN').length;
  document.getElementById('area').textContent=new Set(gardu.map(r=>r.area).filter(Boolean)).size;
</script>
